<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 1040 760" role="img" aria-labelledby="title desc">
  <title id="title">Ignite 文档驱动开发 Loop</title>
  <desc id="desc">从 Feature 需求规格开始，经过 Plan、Contract/Test、Implementation、Verify 和 Design，形成从文档到实现再回到下一轮需求的开发闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef3f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#334155" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8796a8"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c47770"/>
    </marker>
  </defs>

  <rect width="1040" height="760" rx="28" fill="url(#bg)"/>
  <text x="520" y="52" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#172033">Ignite · 文档驱动开发 Loop</text>
  <text x="520" y="82" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="15" fill="#64748b">先把问题写清楚，再把实现做出来；验证结果决定下一轮怎么开始</text>

  <!-- flow track -->
  <line x1="520" y1="142" x2="520" y2="637" stroke="#b7c2ce" stroke-width="3"/>
  <g fill="#718096" stroke="#f8fafc" stroke-width="3">
    <circle cx="520" cy="152" r="6"/><circle cx="520" cy="222" r="6"/><circle cx="520" cy="292" r="6"/>
    <circle cx="520" cy="362" r="6"/><circle cx="520" cy="432" r="6"/><circle cx="520" cy="502" r="6"/><circle cx="520" cy="572" r="6"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <rect x="250" y="126" width="540" height="52" rx="14" fill="#e5edf8" stroke="#9ab1cf" stroke-width="2"/>
    <text x="520" y="148" font-size="12" font-weight="700" fill="#335b87">01 · FEATURE</text>
    <text x="520" y="167" font-size="17" font-weight="700" fill="#2f527b">需求规格：要做什么，边界是什么，怎样算完成</text>

    <rect x="250" y="196" width="540" height="52" rx="14" fill="#e9eef5" stroke="#a6b5c9" stroke-width="2"/>
    <text x="520" y="218" font-size="12" font-weight="700" fill="#596b82">02 · PLAN</text>
    <text x="520" y="237" font-size="17" font-weight="700" fill="#46556b">实施方案：拆任务，关问题，确定验证方式</text>

    <rect x="250" y="266" width="540" height="52" rx="14" fill="#eef0f3" stroke="#aeb8c4" stroke-width="2"/>
    <text x="520" y="288" font-size="12" font-weight="700" fill="#596174">03 · CONTRACT / TEST</text>
    <text x="520" y="307" font-size="17" font-weight="700" fill="#3f4d5e">验收证据：先按规格写测试，再确认预期失败</text>

    <rect x="250" y="336" width="540" height="52" rx="14" fill="#f3eee8" stroke="#d4b99a" stroke-width="2"/>
    <text x="520" y="358" font-size="12" font-weight="700" fill="#9a7450">04 · IMPLEMENTATION</text>
    <text x="520" y="377" font-size="17" font-weight="700" fill="#7a583b">最小实现：编写代码，让目标测试具备通过条件</text>

    <rect x="250" y="406" width="540" height="52" rx="14" fill="#e7f2ed" stroke="#9fc2ae" stroke-width="2"/>
    <text x="520" y="428" font-size="12" font-weight="700" fill="#3e7760">05 · VERIFY</text>
    <text x="520" y="447" font-size="17" font-weight="700" fill="#386a53">运行验证：测试、构建；页面变化再验证浏览器 / E2E</text>

    <rect x="250" y="570" width="540" height="52" rx="14" fill="#dcece4" stroke="#81b39a" stroke-width="2"/>
    <text x="520" y="592" font-size="12" font-weight="700" fill="#3e7760">06 · DESIGN</text>
    <text x="520" y="611" font-size="17" font-weight="700" fill="#2f634c">事实回写：更新当前设计、Plan 状态和验收证据</text>
  </g>

  <!-- verify decision -->
  <g filter="url(#shadow)">
    <path d="M520 476 L594 508 L520 540 L446 508 Z" fill="#fff8e8" stroke="#d7a44e" stroke-width="2"/>
    <text x="520" y="506" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#8c6426">验证通过？</text>
    <text x="520" y="522" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="#a17a3b">结果是否符合规格</text>
  </g>
  <path d="M520 458 V476" fill="none" stroke="#8796a8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M520 540 V570" fill="none" stroke="#8796a8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="548" y="524" width="42" height="22" rx="8" fill="#4f8b73"/>
  <text x="569" y="539" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#ffffff">是</text>

  <!-- failure feedback -->
  <path d="M446 508 H148 V362 H250" fill="none" stroke="#c47770" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="72" y="482" width="190" height="58" rx="13" fill="#f8e9e7" stroke="#d6948c" stroke-width="2"/>
  <text x="167" y="506" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#9f524b">否：修改实现</text>
  <text x="167" y="526" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="#b56a62">回到 Implementation，重新 Verify</text>

  <!-- next increment return -->
  <path d="M520 622 V680 H850 V152 H790" fill="none" stroke="#8796a8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="315" y="652" width="410" height="42" rx="21" fill="#34445a"/>
  <text x="520" y="678" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#f8fafc">通过：进入下一轮 Feature（新的增量或存量改动）</text>
  <text x="865" y="390" transform="rotate(90 865 390)" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#64748b">闭环继续</text>
</svg>
