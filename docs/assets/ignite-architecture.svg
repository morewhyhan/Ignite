<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Ignite 模块化单体架构</title>
  <desc id="desc">从页面与组件经过 Hook、Typed RPC、Hono 路由和 Prisma 到 SQLite 的请求链路。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#64748b" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1100" height="560" rx="28" fill="url(#bg)"/>
  <text x="60" y="64" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Ignite · 模块化单体架构</text>
  <text x="60" y="94" font-family="Inter,Segoe UI,sans-serif" font-size="15" fill="#64748b">统一的数据链路：Hook → Typed RPC → Hono → Prisma</text>

  <rect x="60" y="130" width="980" height="150" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="164" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#2563eb">CLIENT · 浏览器端</text>
  <rect x="88" y="188" width="260" height="62" rx="14" fill="url(#client)"/>
  <text x="218" y="216" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">页面 / 组件</text>
  <text x="218" y="238" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#1e40af">Next.js + React</text>
  <line x1="348" y1="219" x2="418" y2="219" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="188" width="260" height="62" rx="14" fill="url(#client)"/>
  <text x="560" y="216" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">业务 Hook</text>
  <text x="560" y="238" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#1e40af">React Query</text>
  <line x1="690" y1="219" x2="760" y2="219" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="772" y="188" width="240" height="62" rx="14" fill="url(#client)"/>
  <text x="892" y="216" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">Typed RPC</text>
  <text x="892" y="238" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#1e40af">类型安全的 API 调用</text>

  <line x1="892" y1="280" x2="892" y2="338" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="338" width="980" height="150" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="372" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#7c3aed">SERVER · 服务端</text>
  <rect x="88" y="396" width="260" height="62" rx="14" fill="url(#server)"/>
  <text x="218" y="424" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#4c1d95">Hono 路由</text>
  <text x="218" y="446" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#6d28d9">校验 · Session · 错误格式</text>
  <line x1="348" y1="427" x2="418" y2="427" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="396" width="260" height="62" rx="14" fill="url(#server)"/>
  <text x="560" y="424" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#4c1d95">Prisma</text>
  <text x="560" y="446" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#6d28d9">类型安全的数据访问</text>
  <line x1="690" y1="427" x2="760" y2="427" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="772" y="396" width="240" height="62" rx="14" fill="url(#data)"/>
  <text x="892" y="424" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#166534">SQLite</text>
  <text x="892" y="446" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#15803d">本地默认数据库</text>

  <text x="60" y="530" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#64748b">认证由 Better Auth 提供；业务模块位于 src/modules/，页面只负责路由与组合。</text>
</svg>
